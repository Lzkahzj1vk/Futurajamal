<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accès Fermé – Futura</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f5f0e8;
            --ink: #1a1a2e;
            --accent: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background glow like login page */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37,99,235,0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
        }

        .icon {
            font-size: 72px;
            margin-bottom: 24px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
        }

        .brand {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 32px;
        }

        h1 {
            font-size: 36px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.2;
            margin-bottom: 16px;
            color: #fff;
        }

        .day-badge {
            display: inline-block;
            background: rgba(37,99,235,0.25);
            border: 1px solid rgba(37,99,235,0.5);
            color: #93c5fd;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        p {
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            line-height: 1.7;
            margin-bottom: 8px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.15);
            margin: 28px auto;
        }

        .info {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }

        .info strong {
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🔒</span>
        <div class="brand">Futura</div>
        <h1>Nous sommes fermés</h1>
        <div class="day-badge">{{ day_name }}</div>
        <p>L'application n'est pas disponible le week-end.</p>
        <p>Revenez nous voir le lundi matin !</p>
        <div class="divider"></div>
        <p class="info">
            Jours d'accès&nbsp;: <strong>Lundi – Vendredi</strong>
        </p>
    </div>
</body>
</html>
